<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donasi - Yayasan Kasih Anak Kanker Indonesia</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/min.js"></script>
    <style>
        :root {
            --primary-color: #e63946;
            --secondary-color: #457b9d;
            --light-color: #f8f9fa;
            --dark-color: #1d3557;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-color);
            margin: 0;
            padding: 20px;
            color: var(--dark-color);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2, h3 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
        }

        .qris-section {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 8px;
        }

        .qris-image {
            max-width: 250px;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #c92a36;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        hr {
            border: 0;
            height: 1px;
            background: #ddd;
            margin: 30px 0;
        }

        #voucherArea {
            display: none;
            text-align: center;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 15px;
        }

        .download-btn {
            background-color: var(--secondary-color);
            margin-top: 15px;
        }
        .download-btn:hover {
            background-color: #315871;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Yayasan Kasih Anak Kanker Indonesia</h2>
    
    <div class="qris-section">
        <img src="QR JKT.jpeg" alt="QRIS YKAKI Jakarta" class="qris-image">
    </div>

    <form id="donationForm">
        <input type="hidden" name="target_email" value="it.ykaki@gmail.com">
        <input type="hidden" id="hiddenDate" name="donation_date">
        <input type="hidden" id="hiddenSerial" name="voucher_serial">

        <div class="form-group">
            <label id="nameLabel" for="donorName">Nama Donatur</label>
            <input type="text" id="donorName" name="donor_name" placeholder="Masukkan nama lengkap Anda" required>
            <div class="checkbox-group">
                <input type="checkbox" id="anonymousCheck">
                <label style="margin: 0; font-weight: normal; font-size: 14px;" for="anonymousCheck">Sembunyikan nama saya (Anonim)</label>
            </div>
        </div>

        <div class="form-group">
            <label for="donationAmount">Jumlah Donasi (Rp)</label>
            <input type="number" id="donationAmount" name="donation_amount" placeholder="10000" min="10000" required>
        </div>

        <div class="form-group">
            <label for="transferProof">Upload Bukti Transfer</label>
            <input type="file" id="transferProof" name="transfer_proof" accept="image/*" required>
        </div>

        <button type="submit" id="submitBtn">Konfirmasi & Ambil Voucher</button>
    </form>

    <hr id="divider" style="display:none;">

    <div id="voucherArea">
        <h3>Terima Kasih Atas Kebaikan Anda!</h3>
        <p>E-Voucher Penghargaan Anda telah berhasil diterbitkan:</p>
        
        <canvas id="voucherCanvas"></canvas>
        <br>
        <button class="download-btn" id="downloadBtn">Simpan / Download Voucher</button>
    </div>
</div>

<script>
    // =============================================================
    // INISIALISASI EMAILJS
    // Ganti teks di bawah dengan "Public Key" asli Anda dari EmailJS
    // =============================================================
    emailjs.init({
      publicKey: "rhiZ1GWP8AgQdnReV", 
    });

    const anonymousCheck = document.getElementById('anonymousCheck');
    const donorNameInput = document.getElementById('donorName');
    const donationForm = document.getElementById('donationForm');
    const submitBtn = document.getElementById('submitBtn');
    const voucherArea = document.getElementById('voucherArea');
    const divider = document.getElementById('divider');
    const canvas = document.getElementById('voucherCanvas');
    const ctx = canvas.getContext('2d');

    // Load gambar kupon otomatis
    let img = new Image();
    img.src = "kupon_10000.png"; 

    anonymousCheck.addEventListener('change', function() {
        if(this.checked) {
            donorNameInput.value = "Orang Baik";
            donorNameInput.disabled = true;
        } else {
            donorNameInput.value = "";
            donorNameInput.disabled = false;
        }
    });

    donationForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerText = "Mengirim Bukti ke Email & Memproses...";

        const nama = donorNameInput.value || "Orang Baik";
        const nominalMentah = document.getElementById('donationAmount').value;
        const jumlah = parseInt(nominalMentah).toLocaleString('id-ID');
        const opsiTanggal = { year: 'numeric', month: 'long', day: 'numeric' };
        const tanggal = new Date().toLocaleDateString('id-ID', opsiTanggal);
        const nomorSeri = "" + Math.floor(100000 + Math.random() * 900000);

        // Pasang data ke input tersembunyi agar ikut terkirim ke email
        document.getElementById('hiddenDate').value = tanggal;
        document.getElementById('hiddenSerial').value = nomorSeri;

        // Tampilkan container voucher terlebih dahulu
        divider.style.display = 'block';
        voucherArea.style.display = 'block';
        voucherArea.scrollIntoView({ behavior: 'smooth' });

        // Evaluasi pemuatan gambar yang aman dari CORS
        if (img.complete && img.naturalWidth !== 0) {
            gambarKeCanvas(nama, jumlah, tanggal, nomorSeri);
            kirimEmailKeYkaki(this);
        } else {
            img.onload = function() {
                gambarKeCanvas(nama, jumlah, tanggal, nomorSeri);
                kirimEmailKeYkaki(donationForm);
            };
            img.onerror = function() {
                // Jalankan metode konversi base64 jika diblokir oleh sistem file lokal browser
                fetch('kupon_10000.png')
                    .then(response => response.blob())
                    .then(blob => {
                        const reader = new FileReader();
                        reader.onloadend = function() {
                            img = new Image();
                            img.onload = function() {
                                gambarKeCanvas(nama, jumlah, tanggal, nomorSeri);
                                kirimEmailKeYkaki(donationForm);
                            };
                            img.src = reader.result;
                        };
                        reader.readAsDataURL(blob);
                    })
                    .catch(err => {
                        gambarKeCanvas(nama, jumlah, tanggal, nomorSeri);
                        kirimEmailKeYkaki(donationForm);
                    });
            };
        }
    });

    // Fungsi pengiriman email otomatis via EmailJS
    function kirimEmailKeYkaki(formElement) {
        // Ganti 'YOUR_SERVICE_ID' dengan Service ID SMTP Anda (ex: service_de69rd8)
        // Ganti 'YOUR_TEMPLATE_ID' dengan Template ID Anda dari dashboard EmailJS
        emailjs.sendForm('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', formElement)
            .then(function() {
                console.log('Bukti TF Berhasil Dikirim ke it.ykaki@gmail.com!');
                submitBtn.disabled = false;
                submitBtn.innerText = "Konfirmasi & Ambil Voucher";
            }, function(error) {
                console.error('EmailJS Error:', error);
                alert("Sistem gagal mengirim email otomatis. Silakan periksa kembali parameter Port/SSL di dashboard EmailJS Anda.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Konfirmasi & Ambil Voucher";
            });
    }

    function gambarKeCanvas(nama, jumlah, tanggal, nomorSeri) {
        canvas.width = img.naturalWidth || 2048;
        canvas.height = img.naturalHeight || 1024;

        const W = canvas.width;
        const H = canvas.height;

        ctx.clearRect(0, 0, W, H);

        if(img.naturalWidth !== 0) {
            ctx.drawImage(img, 0, 0, W, H);
        } else {
            ctx.fillStyle = "#01A5E1";
            ctx.fillRect(0, 0, W, H);
        }

        const ukuranHurufStub = Math.round(H * 0.035);

        // 1. Plot Teks Vertikal di Stub Kiri Kupon
        cetakTeksTegak(nama, W * 0.145, H * 0.68, `bold ${ukuranHurufStub}px Arial`, "#002A54");
        cetakTeksTegak(tanggal, W * 0.180, H * 0.68, `bold ${ukuranHurufStub - 2}px Arial`, "#002A54");
        cetakTeksTegak("No. " + nomorSeri, W * 0.110, H * 0.68, `bold ${ukuranHurufStub}px 'Courier New', monospace`, "#D32F2F");

        // 2. Plot Nomor Seri di Atas Kepala Kiri Stub
        ctx.fillStyle = "#01A5E1"; 
        ctx.fillRect(W * 0.10, H * 0.09, W * 0.12, H * 0.07);

        ctx.fillStyle = "#000000";
        ctx.font = `bold ${ukuranHurufStub + 4}px 'Courier New', monospace`;
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        ctx.fillText("No. " + nomorSeri, W * 0.102, H * 0.14);

        // 3. Plot Nominal Tengah Kupon Utamanya
        ctx.fillStyle = "#e63946";
        ctx.font = `bold ${ukuranHurufStub + 6}px 'Segoe UI', Arial`;
        ctx.textAlign = "center";
        ctx.fillText(`[ Nilai Partisipasi: Rp ${jumlah} ]`, W * 0.54, H * 0.52);
    }

    function cetakTeksTegak(text, x, y, font, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-Math.PI / 2);
        ctx.fillStyle = color;
        ctx.font = font;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(text, 0, 0);
        ctx.restore();
    }

    document.getElementById('downloadBtn').addEventListener('click', function() {
        const link = document.createElement('a');
        link.download = 'Voucher_Donasi_YKAKI.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
